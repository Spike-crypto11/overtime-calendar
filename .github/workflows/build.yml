name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 설정
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false

      - name: Gradle 설정 (8.7)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 서버 집계·데이터 보존 테스트
        run: node --test tests/payroll-server.test.cjs

      - name: 단위 테스트 · Lint · 디버그 APK 빌드
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: overtime-calendar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 테스트 및 Lint 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payroll-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
